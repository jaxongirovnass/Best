<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Will you still be my best friend❤️‍🔥</title>
  <!-- Sharichalar (konfetti) effekti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a052e, #4a0847, #1a052e);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }
    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.5s;
    }
    .subtitle {
      font-size: 0.85rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.8;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-top: 15px;
      margin-bottom: 25px;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(255, 105, 180, 0.6);
    }
    .media-card {
      width: 230px;
      height: 320px;
      border-radius: 30px;
      overflow: hidden;
      margin: 10px auto;
      border: 3px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 75, 110, 0.4);
      background-color: #000;
    }
    .media-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .btn {
      background: linear-gradient(45deg, #ff2a5f, #ff758c);
      color: white;
      border: none;
      padding: 16px 45px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 42, 95, 0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:active {
      transform: scale(0.95);
    }
    .hidden { 
      display: none !important; 
    }

    /* Tugmalar joylashuvi */
    .buttons-group {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      position: relative;
      width: 100%;
      justify-content: center;
      min-height: 80px;
    }

    /* Qochadigan "NO" tugmasi */
    #noBtn {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: none;
      transition: all 0.15s ease-out;
      position: absolute;
    }
    
    #yesBtn {
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- 1-SAHIFA: Savol + YES va Qochadigan NO -->
  <div id="page1" class="container">
    <div class="subtitle">ONE QUESTION</div>
    <h1>Will you still be my best friend❤️‍🔥</h1>
    
    <div class="buttons-group">
      <button id="yesBtn" class="btn" onclick="openDoor()">YES</button>
      <button id="noBtn" class="btn">NO</button>
    </div>
  </div>

  <!-- 2-SAHIFA: Video TEPADA + Matn PASTDA -->
  <div id="page2" class="container hidden">
    <!-- VIDEO TEPADA (Aynan siz yuborgan fayl) -->
    <div class="media-card">
      <video id="myVideo" loop muted playsinline autoplay>
        <source src="3d92617870454f6f95a19dbc3efed1a9.mov" type="video/quicktime">
        <source src="3d92617870454f6f95a19dbc3efed1a9.mov" type="video/mp4">
        Sizning brauzeringiz videoni qo'llab-quvvatlamaydi.
      </video>
    </div>
    <!-- MATN PASTDA -->
    <h1>TUK-TUK-TUK<br>OPEN THE DOOR!</h1>
  </div>

  <script>
    // YES tugmasi bosilganda
    function openDoor() {
      document.getElementById('page1').classList.add('hidden');
      document.getElementById('page2').classList.remove('hidden');
      
      const video = document.getElementById('myVideo');
      if (video) {
        video.play().catch(e => console.log(e));
      }

      // Sharichalar (konfetti) otish
      var duration = 3 * 1000;
      var animationEnd = Date.now() + duration;
      var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 999 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      var interval = setInterval(function() {
        var timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) {
          return clearInterval(interval);
        }
        var particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    }

    // NO tugmasini qochirish logikasi
    const noBtn = document.getElementById('noBtn');

    function moveNoButton() {
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      
      const btnWidth = noBtn.offsetWidth || 100;
      const btnHeight = noBtn.offsetHeight || 50;
      
      const maxTop = screenHeight - btnHeight - 20;
      const maxLeft = screenWidth - btnWidth - 20;
      
      const newTop = Math.random() * maxTop + 10;
      const newLeft = Math.random() * maxLeft + 10;
      
      noBtn.style.position = 'fixed';
      noBtn.style.top = newTop + 'px';
      noBtn.style.left = newLeft + 'px';
    }

    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('click', moveNoButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoButton();
    });
  </script>
</body>
</html>
